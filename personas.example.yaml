# Spire persona configuration — example file.
#
# Copy this file to personas.yaml and fill in real credentials.
# personas.yaml is gitignored; never commit it.
#
# Each persona groups all credentials a single environment needs:
#   - fusion: Oracle Fusion REST API credentials (required)
#   - oracle: Oracle Database credentials (optional until Dynamic
#             Orchestration phases 03+ start using the KG)

default_dev:
  fusion:
    base_url: "https://your-pod.example.oraclepdemos.com"
    username: "service.account@example.com"
    password: "your-fusion-password"
    auth_type: "basic"

  oracle:
    dsn: "localhost:1521/FREEPDB1"
    username: "spire"
    password: "your-oracle-password"
