# Spire persona configuration — example file.
#
# Copy this file to personas.yaml and fill in real credentials.
# personas.yaml is gitignored; never commit it.
#
# Each persona groups all credentials a single environment needs:
#   - fusion: Oracle Fusion REST API credentials (required)
#   - oracle: Oracle Database credentials (optional until Dynamic
#             Orchestration phases 03+ start using the KG)

default_dev:
  fusion:
    base_url: "https://your-pod.example.oraclepdemos.com"
    username: "service.account@example.com"
    password: "your-fusion-password"
    auth_type: "basic"

  oracle:
    dsn: "localhost:1521/FREEPDB1"
    username: "spire"
    password: "your-oracle-password"

  # Data scope (optional) — F-076.
  #
  # The business units the Fusion user can actually see. REST is scoped by
  # the integration user's security profile, so pod row counts and REST row
  # counts legitimately differ; declaring the visible set makes the emitted
  # SQL reproduce REST's scope instead of counting rows the user cannot see.
  #
  # Names must match HR_OPERATING_UNITS.NAME, which is also what REST's
  # `BusinessUnit` field returns. Omit this block for no scoping (SQL then
  # returns every business unit — a superset of REST).
  scope:
    visible_business_units:
      - "US1 Business Unit"
      - "UK Business Unit"
