[project]
name = "spire"
version = "0.0.1"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
spire-api = "spire.api.server:main"
spire-ui  = "spire.ui.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring external services (MCP server, Gemini, Fusion pod)",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]

# Diagnostic output, the committed team default (OBS-02).
#
# Everything off is UX-05: a plain run prints the answer on stdout, and
# progress plus the counts footer on stderr. Uncomment a key here and it
# applies to everyone; override per machine with SPIRE_SHOW_PLANNER=1,
# or for a single run with --show-planner / --no-show-planner.
#
# show_all is an OVERRIDE, not a default. When show_all = true, every
# gated flag becomes true regardless of any other value in this file,
# in the environment, or on the command line. An explicit "false" is
# ignored.
#
# To run a subset, set show_all = false and name the flags you want.
# "Set show_all = true and then switch one flag off" is not supported;
# use the subset form instead.
#
# The section may be deleted entirely; absent means all off. An
# unrecognised key is an error naming the key, not a silent no-op.
[tool.spire.diagnostics]
# show_parser = true
# show_planner = true
# show_raw_output = true
# show_synthesizer = true
# show_tokens = true
# show_timings = true
# show_sql = true
show_all = true