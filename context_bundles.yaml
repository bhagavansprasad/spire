  # ── the master plan + its append-only status log ──
  # This bundle is exactly what a new window needs to resume work.
  plan:
  # Current state only. A resuming window reads this to know where it
  # is and what to do next. Reference material (the master plan, the
  # playbook, the endpoints reference) lives in `reference` and is
  # loaded on demand — not read start to finish.
  #
  # Re-pointed 2026-11-27, then 2026-11-28. This bundle used to open with
  # HANDOFF.md, which no longer exists; after the drift cleanup it would
  # have held only two files, neither of which says where the work stands.
  #
  # 2026-11-28: the dated SESSION_STATUS snapshot and the Phase 1 handover
  # were moved to `history`. This bundle's own rule is below — "does a
  # resuming window need this to know where it is and what to do next?" —
  # and a 9-day-old snapshot of a branch that has since moved answers no.
  # It was also the FIRST file here, so every resuming window opened with
  # stale state. Lead with the live queue instead.
  - docs/plan/sme_prompts_status/README.md
  - docs/plan/sme_prompts_status/HANDOFF.md
  - docs/plan/sme_prompts_status/FIX_PLAN.md
  - docs/fixes/FIX_PLAN.md
  - docs/plan/sme_prompts_status/COMPARISON.md
  - docs/plan/WORKING_STYLE.md
  - docs/plan/PENDING_KG_SCHEMA_CORPUS.md
  - docs/design/ARCHITECTURE.md

  # ── reference material — consulted, not read through ──
  # Loaded when a specific phase design, endpoint quirk, or fix
  # procedure is being looked up. Grep, do not read whole.
  reference:
  - docs/reference/spire_fusion_endpoints_reference.md
  - docs/reference/data/oracle_fusion_schema_updated_tables.xlsx
  - docs/plan/KG_ROLE_MAPS.md
  - docs/plan/KG_FIELD_TRANSLATION.md
  - docs/plan/SCHEMA_DISCOVERY_METHOD.md

  # ── the historical record ──
  # Past sessions, findings, fixes, evidence, log-analysis runs.
  # Never loaded as a first bundle; requested only when a specific
  # record is being consulted. Rule for the split: does a resuming
  # window need this to know where it is and what to do next? Yes
  # -> plan. No -> history.
  history:
  - docs/plan/DEMO_SME_2026-11-20.md
  - docs/plan/HANDOVER_KG_SCHEMA.md
  - docs/plan/HANDOVER_KG_SCHEMA_PHASE2.md
