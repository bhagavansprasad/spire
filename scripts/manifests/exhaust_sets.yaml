# promptkit exhaust-tier manifest.
#
# Each name resolves to prompts/<name>.txt. Run order is list order.
#
# Run this tier alone:
#   python scripts/promptkit.py --run --manifest scripts/manifests/exhaust_sets.yaml
#
# Or run every tier in one batch via the full manifest:
#   python scripts/promptkit.py --run --manifest scripts/manifests/promptkit_sets.yaml
#
# Split of promptkit_sets.yaml: smoke=16, verify=17, exhaust=18.

sets:
  - dipstick/dipstick_exhaust
  - supplier/supplier_exhaust
  - payables/payables_exhaust
  - procurement/procurement_exhaust
  - receivables/receivables_exhaust
  - payables_supplier/payables_supplier_exhaust
  - payables_procurement/payables_procurement_exhaust
  - procurement_supplier/procurement_supplier_exhaust
  - columns/columns_exhaust
  - refusals/refusals_exhaust
  - lifecycle/lifecycle_exhaust
  - child_as_root/child_as_root_exhaust
  - truncation/truncation_exhaust
  - date_filters/date_filters_exhaust
  - fields_and_include/fields_and_include_exhaust
  - modes/modes_exhaust
  - retest/retest_prompts
  - refusals/refusals_refusal_examples
