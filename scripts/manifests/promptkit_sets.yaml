# promptkit overnight manifest — the prompt sets to generate + validate + run.
#
# Each name resolves to prompts/<name>.txt (for --generate) and
# prompts/<name>.json (for --validate / --run). Comment a line out
# to skip that set. Order is the run order.
#
# TIERS:
#   smoke    — seconds per set. Run always.
#   verify   — minutes per set. Run before a merge.
#   exhaust  — minutes-to-hours per set. Overnight.
#
# Each set is a module (supplier/payables/procurement/receivables), a
# combination (combinations/*), or a cross-cutting feature (flat files
# at the prompts/ root, named <tier>_<feature>.txt).
#
# Ordering: smoke (fast triage), then verify, then corpus, then exhaust.
# Comment out any tier to skip it.

sets:
  # ── smoke — seconds ─────────────────────────────────────────────
  - dipstick/dipstick_smoke
  - supplier/supplier_smoke
  - payables/payables_smoke
  - procurement/procurement_smoke
  - receivables/receivables_smoke
  - payables_supplier/payables_supplier_smoke
  - payables_procurement/payables_procurement_smoke
  - procurement_supplier/procurement_supplier_smoke
  - columns/columns_smoke
  - refusals/refusals_smoke
  - lifecycle/lifecycle_smoke
  - child_as_root/child_as_root_smoke
  - truncation/truncation_smoke
  - date_filters/date_filters_smoke
  - fields_and_include/fields_and_include_smoke
  - modes/modes_smoke

  # ── verify — minutes ────────────────────────────────────────────
  - dipstick/dipstick_verify
  - supplier/supplier_verify
  - payables/payables_verify
  - procurement/procurement_verify
  - receivables/receivables_verify
  - payables_supplier/payables_supplier_verify
  - payables_procurement/payables_procurement_verify
  - procurement_supplier/procurement_supplier_verify
  - columns/columns_verify
  - refusals/refusals_verify
  - lifecycle/lifecycle_verify
  - child_as_root/child_as_root_verify
  - truncation/truncation_verify
  - date_filters/date_filters_verify
  - fields_and_include/fields_and_include_verify
  - modes/modes_verify

  # ── corpus — external, verbatim, no tier ────────────────────────
  - sme/sme_testcases

  # ── exhaust — overnight. Comment out for a faster pass. ─────────
  - dipstick/dipstick_exhaust
  - supplier/supplier_exhaust
  - payables/payables_exhaust
  - procurement/procurement_exhaust
  - receivables/receivables_exhaust
  - payables_supplier/payables_supplier_exhaust
  - payables_procurement/payables_procurement_exhaust
  - procurement_supplier/procurement_supplier_exhaust
  - columns/columns_exhaust
  - refusals/refusals_exhaust
  - lifecycle/lifecycle_exhaust
  - child_as_root/child_as_root_exhaust
  - truncation/truncation_exhaust
  - date_filters/date_filters_exhaust
  - fields_and_include/fields_and_include_exhaust
  - modes/modes_exhaust

  # ── non-tier prompt files (window 20 parity sweep) ──
  - retest/retest_prompts
  - refusals/refusals_refusal_examples
