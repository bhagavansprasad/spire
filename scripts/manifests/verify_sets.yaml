# promptkit verify-tier manifest.
#
# Each name resolves to prompts/<name>.txt. Run order is list order.
#
# Run this tier alone:
#   python scripts/promptkit.py --run --manifest scripts/manifests/verify_sets.yaml
#
# Or run every tier in one batch via the full manifest:
#   python scripts/promptkit.py --run --manifest scripts/manifests/promptkit_sets.yaml
#
# Split of promptkit_sets.yaml: smoke=16, verify=17, exhaust=18.

sets:
  - dipstick/dipstick_verify
  - supplier/supplier_verify
  - payables/payables_verify
  - procurement/procurement_verify
  - receivables/receivables_verify
  - payables_supplier/payables_supplier_verify
  - payables_procurement/payables_procurement_verify
  - procurement_supplier/procurement_supplier_verify
  - columns/columns_verify
  - refusals/refusals_verify
  - lifecycle/lifecycle_verify
  - child_as_root/child_as_root_verify
  - truncation/truncation_verify
  - date_filters/date_filters_verify
  - fields_and_include/fields_and_include_verify
  - modes/modes_verify
  - sme/sme_testcases
