<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">User sends query with tools. LLM consults Knowledge Graph for entities, relationships, and patterns. LLM plans tool calls based on KG guidance. Tools execute against Fusion APIs in an agent loop. Final answer returns to user.</desc>
